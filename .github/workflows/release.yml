name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (for example v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: ./mvnw -B -q verify

      - name: Build the artifacts
        run: ./scripts/build-release.sh

      # The hosted site reads GitHub Releases and resolves an artifact by file
      # extension: .jar for "any JVM", .tar.gz for Linux. The names produced by
      # build-release.sh already match that, so nothing has to be renamed here.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Upload the artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: jvd-release
          path: dist/*
