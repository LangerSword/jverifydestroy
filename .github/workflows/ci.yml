name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.jdk }} / ${{ matrix.gc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # JDK 25 is the only supported version: the build sets
        # maven.compiler.release=25, so a lower JDK cannot compile the project at all.
        jdk: [ '25' ]
        # The canary verifier behaves differently per collector: G1 leaves stale
        # copies, ZGC maps its heap via /memfd:, and Shenandoah is the outlier
        # (docs/RESULTS.md). Running the suite under more than one collector
        # catches collector-specific regressions. This is how the ZGC /memfd: bug
        # was found in the first place (docs/ASSUMPTIONS.md #17).
        gc: [ 'G1', 'ZGC', 'Shenandoah' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven

      - name: Verify
        run: ./mvnw -B -q verify
        env:
          # The FFM downcalls in the memory module (mlock, madvise) are restricted
          # methods on JDK 25 and need this flag. Without it the module still works
          # but reports degraded hardening, so CI would not exercise the hardened
          # path.
          MAVEN_OPTS: -Djava.awt.headless=true

      - name: Verify (retry on a mirror)
        # The wrapper downloads Maven itself on a cold runner, and that download can
        # fail on a transient network error — which fails the whole job for a reason
        # that has nothing to do with the code. The wrapper honours MVNW_REPOURL, so
        # a second attempt against a mirror gives the build a second chance before
        # it is called a failure.
        if: failure()
        run: |
          echo "the build failed; retrying the Maven download against a mirror"
          MVNW_REPOURL=https://repo1.maven.org/maven2 ./mvnw -B -q verify
        env:
          MAVEN_OPTS: -Djava.awt.headless=true

      - name: Check the runnable jars
        if: matrix.gc == 'G1'
        run: |
          java -jar cli/target/cli-1.0.0.jar version
          java -jar web/target/web-1.0.0.jar --help 2>&1 | head -2 || true
